# 打 tag（v*）时在各平台打包，并创建 GitHub Release。
# 可选的签名密钥（在仓库 Settings → Secrets 里配置）：
#   Android：ANDROID_KEYSTORE_BASE64、ANDROID_KEY_ALIAS、ANDROID_KEYSTORE_PASSWORD
#   iOS：    IOS_CERT_P12_BASE64、IOS_CERT_PASSWORD、IOS_PROFILE_BASE64、IOS_SIGN_IDENTITY
# 自动更新（必需）：UPDATE_KEY，即 keys/update.secret 的内容（nsh keygen keys/update 生成；
#   公钥在 nsh.json 的 updater.publicKey）。Release 里附带签名的 latest.json，应用据此检查和安装更新。
# 更新说明取自 tag 的注释（git tag -a v1.2.0 -m "..."）。
# 没有配置时：Android 用调试签名（可直接安装），iOS 只出模拟器包和未签名的 .app。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NSH_VERSION: nightly

jobs:
  apple:
    name: macOS / iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=$NSH_VERSION sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test
        run: nsh test
      - name: macOS
        run: |
          nsh package --target macos -o out/macos
          mkdir -p dist
          ditto -c -k --keepParent out/macos/*.app dist/mahjong-macos-arm64.zip
          # nsh package 同时生成自动更新用的包：<名字>-<版本>-<系统>-<架构>。
          cp out/macos/*-macos-aarch64.tar.gz dist/
      - name: iOS simulator
        run: |
          nsh package --target ios-simulator -o out/ios-sim
          ditto -c -k --keepParent out/ios-sim/*.app dist/mahjong-ios-simulator.zip
      - name: iOS device
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_SIGN_IDENTITY: ${{ secrets.IOS_SIGN_IDENTITY }}
        run: |
          if [ -n "$IOS_CERT_P12_BASE64" ]; then
            KC="$RUNNER_TEMP/sign.keychain-db"
            security create-keychain -p ci "$KC"
            security set-keychain-settings "$KC"
            security unlock-keychain -p ci "$KC"
            echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -k ci "$KC"
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            echo "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
            nsh package --target ios -o out/ios --sign "$IOS_SIGN_IDENTITY" --profile "$RUNNER_TEMP/app.mobileprovision"
            cp out/ios/*.ipa dist/mahjong-ios.ipa
          else
            nsh package --target ios -o out/ios
            ditto -c -k --keepParent out/ios/*.app dist/mahjong-ios-unsigned.zip
          fi
      - uses: actions/upload-artifact@v4
        with: { name: apple, path: dist/* }

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=$NSH_VERSION sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Package
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            nsh package --target android -o out/android --keystore "$RUNNER_TEMP/release.jks" --key-alias "$ANDROID_KEY_ALIAS"
          else
            nsh package --target android -o out/android
          fi
          mkdir -p dist
          cp out/android/*.apk dist/mahjong-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/* }

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=$NSH_VERSION sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Package
        run: |
          nsh package --target linux -o out/linux
          mkdir -p dist
          cp out/linux/Mojiang.tar.gz dist/mahjong-linux-x86_64.tar.gz
          cp out/linux/*-linux-x86_64.tar.gz dist/
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install nsh
        shell: pwsh
        run: |
          $env:NSH_VERSION = "${{ env.NSH_VERSION }}"
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Package
        shell: pwsh
        run: |
          nsh package --target windows -o out/windows
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/windows/Mojiang.zip dist/mahjong-windows-x86_64.zip
          Copy-Item out/windows/*-windows-x86_64.zip dist/
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }

  release:
    name: GitHub Release
    needs: [apple, android, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=$NSH_VERSION sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Update manifest
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="v$(jq -r .version nsh.json)"; fi
          git fetch --tags --force >/dev/null 2>&1 || true
          git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "Mojiang $TAG" > "$RUNNER_TEMP/notes.md"
          [ -n "$UPDATE_KEY" ] || { echo "::error::UPDATE_KEY secret is missing"; exit 1; }
          printf '%s\n' "$UPDATE_KEY" > "$RUNNER_TEMP/update.secret"
          nsh update-manifest dist/Mojiang-*.tar.gz dist/Mojiang-*.zip \
            --notes "$RUNNER_TEMP/notes.md" \
            --key "$RUNNER_TEMP/update.secret" \
            --link "android=https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/mahjong-android.apk" \
            -o dist
          rm -f "$RUNNER_TEMP/update.secret"
          cat dist/latest.json
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="v$(jq -r .version nsh.json)"; fi
          SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          NOTES="$(cat "$RUNNER_TEMP/notes.md")

          Install: see the README. Web: $SITE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Mojiang $TAG" --notes "$NOTES"
          fi
